<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Palm Jebel Ali – Villas Frond M & N | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #f5f7fb;
    }

    /* HEADER */
    .site-header {
      position: relative;
      width: 100%;
    }

    .site-header-inner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 10px 16px;
      color: #fff;
    }

    .site-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .site-logo img {
      height: 32px;
    }

    /* HERO */
    .hero-wrapper {
      position: relative;
    }

    .hero-wrapper img {
      width: 100%;
      display: block;
    }

    .hero-text {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      text-align: center;
      width: 100%;
      padding: 0 20px;
    }

    .hero-text h1 {
      font-size: 56px;
      font-weight: 700;
      margin: 0;
      text-shadow: 0 3px 8px rgba(0,0,0,0.65);
      white-space: nowrap;
    }

    /* MAIN */
    .page-container {
      padding: 40px 20px;
      text-align: center;
    }

    /* BUTTONS */
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      background: #0077aa;
      transition: 0.3s;
    }

    .btn:hover {
      background: #005f88;
    }

    .btn img {
      height: 20px;
    }

    /* SLIDER */
    .slider-container {
      max-width: 950px;
      margin: 30px auto 40px;
      overflow: hidden;
      border-radius: 12px;
    }

    .slider-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .slide {
      flex: 0 0 100%;
    }

    .slide img {
      width: 100%;
      display: block;
    }

    .slider-dots {
      margin-top: 12px;
    }

    .dot {
      height: 10px;
      width: 10px;
      margin: 0 4px;
      background: #bbb;
      border-radius: 50%;
      display: inline-block;
      cursor: pointer;
    }

    .dot.active {
      background: #0077aa;
      width: 14px;
      border-radius: 8px;
    }

    /* FOOTER */
    .footer-credit {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(255,255,255,0.9);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      color: #555;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-logo">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnFotK6q51zkn2-D63JAu73KsQnfkTv4OXIg&s">
        <span>Shapoorji Login Page</span>
      </div>
    </div>

    <div class="hero-wrapper">
      <img src="https://www.nakheel.com/images/nakheelcorporatelibraries/construction-updates/pja-1920x1080-01.png">
      <div class="hero-text">
        <h1>Palm Jebel Ali – Villas Frond M & N</h1>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="page-container">

    <p style="font-size:1.4rem; font-weight:600;">
      Welcome to Palm Jebel Ali – Villas Frond M & N Project. By Shapoorji Pallonji
    </p>

    <!-- ✅ BUTTONS -->
    <div class="btn-group">
      <a href="login.html" class="btn">
	
	<img src="https://upload.wikimedia.org/wikipedia/en/thumb/5/55/Shapoorji_Pallonji_Group_logo.svg/250px-Shapoorji_Pallonji_Group_logo.svg.png">
        Login to Dashboards...
      </a>

      <a href="https://shapoorji.cupix-eu.works" class="btn" target="_blank">
        <img src="https://assets-global.website-files.com/60a1d24dc3ad906020ec0b79/60a1d24dc3ad90b5b5ec0d96_cupix_tagline-p-500.png">
        Login to Cupix Platform...
      </a>
    </div>

    <!-- SLIDER -->
    <div class="slider-container">
      <div class="slider-track">
        <div class="slide"><img src="https://i.postimg.cc/XNB7s7cx/BVA.jpg"></div>
        <div class="slide"><img src="https://i.postimg.cc/jqndMdQh/BVB.jpg"></div>
        <div class="slide"><img src="https://i.postimg.cc/T25YtYq0/BVD.jpg"></div>
        <div class="slide"><img src="https://i.postimg.cc/6645M5Lg/BVF.jpg"></div>
      </div>

      <div class="slider-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

  </main>

  <div class="footer-credit">by Sohail</div>

  <!-- SLIDER SCRIPT -->
  <script>
    const track = document.querySelector(".slider-track");
    const dots = document.querySelectorAll(".dot");
    let index = 0;

    function showSlide(i) {
      const slides = track.children.length;
      index = (i + slides) % slides;
      track.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach(d => d.classList.remove("active"));
      dots[index].classList.add("active");
    }

    setInterval(() => showSlide(index + 1), 4000);
    dots.forEach((dot, i) => dot.addEventListener("click", () => showSlide(i)));
  </script>

</body>
</html>
